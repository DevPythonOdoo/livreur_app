name: livreur_app
description: "KingDely Route"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  image_picker: ^1.1.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  provider: ^6.1.0
  signature: ^5.5.0
  connectivity_plus: ^6.0.0
  flutter_tts: ^4.0.0
  flutter_local_notifications: ^18.0.0
  pdf: ^3.11.0
  printing: ^5.13.0
  geolocator: ^14.0.2
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  wakelock_plus: ^1.2.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "0xFFFFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 24



  

flutter:
  uses-material-design: true
  assets:
    - assets/
